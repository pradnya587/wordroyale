name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"

jobs:
  # Which parts of the monorepo changed? Only those get rebuilt and redeployed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.f.outputs.auth-service }}
      game-service: ${{ steps.f.outputs.game-service }}
      stats-service: ${{ steps.f.outputs.stats-service }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            auth-service: ['services/auth-service/**']
            game-service: ['services/game-service/**']
            stats-service: ['services/stats-service/**']
            frontend: ['frontend/**']

  test-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, game-service, stats-service]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379   # enables the stats-service Redis Streams tests
      - name: Dependency audit (high severity and above)
        run: npm audit --omit=dev --audit-level=high

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, test-services, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,  context: services/auth-service }
          - { name: game-service,  context: services/game-service }
          - { name: stats-service, context: services/stats-service }
          - { name: frontend,      context: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.name] == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.name] == 'true'
      - name: Build image (for scanning)
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Security scan (Trivy) - fail on HIGH/CRITICAL with a fix available
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image
        if: needs.changes.outputs[matrix.name] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/wordroyale-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/wordroyale-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file and infra config to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,infra"
          target: /opt/wordroyale
      - name: Pull new images and restart only what changed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/wordroyale
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
